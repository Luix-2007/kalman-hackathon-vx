[project]
name = "api"
version = "0.1.0"
description = "Lambdas da API (uma pasta por funcao, cada uma com seu template SAM)"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
chatbot = [
    "bedrock-agentcore>=1.25.4",
    "strands-agents>=1.64.0",
]
dev = [
    "boto3",
    "duckdb",          # faz o papel do Athena nos testes da api/matriz
    "moto[dynamodb]",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["*/tests"]
python_files = ["test_*.py"]  # smoke_*.py rodam contra a AWS, só via make
