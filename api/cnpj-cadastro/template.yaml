AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cadastro de usuarios (Cognito) com enriquecimento do CNPJ via OpenCNPJ, salvo no DynamoDB

Parameters:
  EventSource:
    Type: String
    Default: app.usuarios
  EventDetailType:
    Type: String
    Default: UsuarioCadastrado
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:3000,http://localhost:5173"
    Description: Endereços do seu front (CORS). Adicione o domínio de produção.
  FixturesEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      true = CNPJs "KALMAN..." vêm de src/fixtures/ (empresa de teste) em vez do OpenCNPJ.
      Ligue só na stack de demonstração.

Resources:
  # ---------- Autenticação ----------
  # Guarda e-mail, senha (com hash, gerenciado pela AWS), verificação de e-mail e recuperação de senha.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain          # não apaga as contas se a stack for removida/recriada
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-usuarios
      UsernameAttributes: [email]   # login com e-mail
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # "App" que o front usa para fazer login. Sem secret porque roda no navegador.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH             # login do front (Amplify)
        - ALLOW_REFRESH_TOKEN_AUTH        # renovar o token sem pedir senha de novo
        - ALLOW_ADMIN_USER_PASSWORD_AUTH  # só com credenciais IAM: usado pelos smoke tests
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  # ---------- Dados ----------
  # Tabela única (modelo completo em src/dados.py):
  #   user_id = <sub>             a organização do usuário (cnpj, papel dono|membro)
  #   user_id = CNPJ#<cnpj>       a organização: dono, dados do CNPJ, formulário, membros
  #   user_id = CONVITE#<email>   convite pendente (apagado sozinho pelo TTL)
  UsuariosCnpjTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id      # = "sub" do Cognito
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      TimeToLiveSpecification:     # convites vencidos somem sozinhos (até ~48h depois)
        AttributeName: expira_em
        Enabled: true

  FailedEventsQueue:   # eventos que falharam mesmo após as tentativas (para não perder cadastro)
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  # ---------- API ----------
  # URL pública que o front chama. Toda rota exige o token do Cognito (header Authorization).
  CadastroApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization]
      DefaultRouteSettings:      # limita abuso do endpoint público
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # POST /cadastro: vincula o CNPJ ao usuário e dispara a consulta em segundo plano
  CadastroFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: cadastro.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref UsuariosCnpjTable
          USER_POOL_ID: !Ref UserPool
          EVENT_SOURCE: !Ref EventSource
          EVENT_DETAIL_TYPE: !Ref EventDetailType
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: default
        - DynamoDBCrudPolicy:      # transação: cria a organização e libera o CNPJ anterior
            TableName: !Ref UsuariosCnpjTable
        - Statement:               # lê o e-mail do dono no Cognito (o access token não traz)
            - Effect: Allow
              Action: cognito-idp:ListUsers
              Resource: !GetAtt UserPool.Arn
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref CadastroApi
            Method: POST
            Path: /cadastro

  # GET/PATCH /cadastro/me: o front lê os dados e salva o que o usuário preencheu
  UsuarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: usuario.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref UsuariosCnpjTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsuariosCnpjTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsuariosCnpjTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref CadastroApi
            Method: GET
            Path: /cadastro/me
        Patch:
          Type: HttpApi
          Properties:
            ApiId: !Ref CadastroApi
            Method: PATCH
            Path: /cadastro/me

  # Membros da organização e convites (src/membros.py)
  MembrosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: membros.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref UsuariosCnpjTable
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsuariosCnpjTable
        - Statement:               # e-mail do usuário, para achar o convite dele
            - Effect: Allow
              Action: cognito-idp:ListUsers
              Resource: !GetAtt UserPool.Arn
      Events:
        ListarMembros:
          Type: HttpApi
          Properties: { ApiId: !Ref CadastroApi, Method: GET, Path: /cadastro/membros }
        Convidar:
          Type: HttpApi
          Properties: { ApiId: !Ref CadastroApi, Method: POST, Path: /cadastro/membros }
        RemoverMembro:
          Type: HttpApi
          Properties: { ApiId: !Ref CadastroApi, Method: DELETE, Path: "/cadastro/membros/{id}" }
        VerConvite:
          Type: HttpApi
          Properties: { ApiId: !Ref CadastroApi, Method: GET, Path: /cadastro/convite }
        AceitarConvite:
          Type: HttpApi
          Properties: { ApiId: !Ref CadastroApi, Method: POST, Path: /cadastro/convite }
        RecusarConvite:
          Type: HttpApi
          Properties: { ApiId: !Ref CadastroApi, Method: DELETE, Path: /cadastro/convite }

  # Evento UsuarioCadastrado -> consulta o OpenCNPJ (ou a fixture, ver src/fontes_cnpj.py) -> grava no DynamoDB
  CnpjLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref UsuariosCnpjTable
          FIXTURES_ENABLED: !Ref FixturesEnabled
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailedEventsQueue.Arn
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref UsuariosCnpjTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FailedEventsQueue.QueueName
      Events:
        UsuarioCadastrado:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [!Ref EventSource]
              detail-type: [!Ref EventDetailType]

Outputs:
  ApiUrl:
    Description: "URL base para o front: POST {ApiUrl}, GET/PATCH {ApiUrl}/me, {ApiUrl}/membros, {ApiUrl}/convite"
    Value: !Sub https://${CadastroApi}.execute-api.${AWS::Region}.amazonaws.com/cadastro
  UserPoolId:
    Description: Configuração do login no front (Amplify)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Configuração do login no front (Amplify)
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref UsuariosCnpjTable
  FunctionName:
    Value: !Ref CnpjLookupFunction
