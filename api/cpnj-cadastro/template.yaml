AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Consulta o CNPJ do usuario no OpenCNPJ no cadastro e salva no DynamoDB

Parameters:
  EventSource:
    Type: String
    Default: app.usuarios
  EventDetailType:
    Type: String
    Default: UsuarioCadastrado

Resources:
  UsuariosCnpjTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  FailedEventsQueue:   # eventos que falharam mesmo após as tentativas (para não perder cadastro)
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  CnpjLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref UsuariosCnpjTable
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailedEventsQueue.Arn
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref UsuariosCnpjTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FailedEventsQueue.QueueName
      Events:
        UsuarioCadastrado:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [!Ref EventSource]
              detail-type: [!Ref EventDetailType]

Outputs:
  TableName:
    Value: !Ref UsuariosCnpjTable
  FunctionName:
    Value: !Ref CnpjLookupFunction
